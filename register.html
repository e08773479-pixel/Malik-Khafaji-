<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب | ملك خفاجي</title><style>@import url(https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap);*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#030707;color:#f4fbf9;font-family:Cairo,sans-serif}.box{width:min(520px,100%);padding:28px;border:1px solid #ffffff14;border-radius:24px;background:#0a1514;box-shadow:0 25px 80px #0008}h1{margin:0 0 8px}.muted{color:#8aa09a}label{display:block;margin:14px 0 6px;font-weight:700}input{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff14;background:#ffffff08;color:#fff;outline:0}.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:#19d47c;color:#03100a;font-weight:900;cursor:pointer}.links{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:#38d9ff}.msg{margin-top:12px;color:#19d47c;min-height:24px}.brand{font-weight:900;color:#19d47c;margin-bottom:20px}</style></head><body><main class="box"><div class="brand">👑 ملك خفاجي</div><h1>إنشاء حساب</h1><p class="muted">واجهة المصادقة جاهزة للربط مع Backend حقيقي.</p><form id="form"><label>الاسم</label><input id="name" type="text" required><label>البريد الإلكتروني</label><input id="email" type="email" required><label>كلمة المرور</label><input id="password" type="password" required><label>تأكيد كلمة المرور</label><input id="confirm" type="password" required><button class="btn">إنشاء الحساب</button><div class="msg" id="msg"></div></form><div class="links"><a href="login.html">تسجيل الدخول</a><a href="../index.html">الرئيسية</a></div></main><script>document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();document.getElementById('msg').textContent='الواجهة جاهزة للربط مع نظام المصادقة الحقيقي.'})</script></body></html>
